{% load static %}
{% for item in listings %}
<a class="card" href="{{ item.get_absolute_url }}">
    <div class="placeholder card-photo">
        {% if item.image_url %}<img src="{{ item.image_url }}" alt="{{ item.title }}" loading="lazy" referrerpolicy="no-referrer">{% else %}<img src="{% static 'img/no-image.png' %}" alt="No photo yet">{% endif %}
    </div>
    <div class="card-text">
        <h3>{{ item.title }}</h3>
        <p>{{ item.grower_name }}, {{ item.area }}</p>
    </div>
    <div class="card-row">
        <span class="price">{{ item.price_label }}</span>
        <span class="until">{{ item.status_label }}</span>
    </div>
</a>
{% endfor %}
