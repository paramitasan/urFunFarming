{% load static %}
{% for item in listings %}
<article class="card">
    <div class="placeholder card-photo">
        <img src="{% static 'img/no-image.png' %}" alt="No photo yet">
    </div>
    <div class="card-text">
        <h3>{{ item.title }}</h3>
        <p>{{ item.grower }}</p>
    </div>
    <div class="card-row">
        <span class="price">{{ item.price }}</span>
        <span class="until">{{ item.until }}</span>
    </div>
</article>
{% endfor %}
