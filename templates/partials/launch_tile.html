<a class="launch-tile" href="{{ href|default:'#' }}" data-tone="{{ tone }}">
    <span class="launch-top">
        <span class="launch-icon">{% include icon %}</span>
        <span class="launch-title">{{ title }}</span>
        <span class="launch-arrow">{% include 'svg/icons/arrow.svg' %}</span>
    </span>
    <span class="launch-desc">{{ text }}</span>
    <span class="launch-mark">{% include icon %}</span>
</a>
