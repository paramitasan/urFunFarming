{# "..." menu, only for the post's author #}
<details class="forum-menu">
    <summary class="forum-menu-button" aria-label="Post actions" title="Options">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/>
        </svg>
    </summary>
    <div class="forum-menu-list">
        <form method="post" action="{% url 'forum:forum_toggle_answered' forum.pk %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button type="submit" class="forum-menu-answered" aria-pressed="{% if forum.is_answered %}true{% else %}false{% endif %}">
                {% if forum.is_answered %}
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M2.5 7.5l3 3 6-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                {% endif %}
                Answered
            </button>
        </form>

        <a href="{% url 'forum:forum_edit' forum.pk %}?next={{ request.get_full_path|urlencode }}">Edit</a>
        
        <form method="post" action="{% url 'forum:forum_delete' forum.pk %}"
              data-confirm-title="Delete forum?"
              data-confirm-text="This forum, its photos, and replies will be removed. This can’t be undone."
              data-confirm-ok="Delete forumm">
            {% csrf_token %}
            {% if request.resolver_match.url_name == "forum_list" %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            {% endif %}
            <button type="submit" class="forum-menu-delete">Delete</button>
        </form>
    </div>
</details>
