{# "..." menu for reply, only for author #}
<details class="forum-menu">
    <summary class="forum-menu-button" aria-label="Answer actions" title="Options">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <circle cx="4" cy="10" r="1.6"/><circle cx="10" cy="10" r="1.6"/><circle cx="16" cy="10" r="1.6"/>
        </svg>
    </summary>
    <div class="forum-menu-list">
        <a href="{% url 'forum:reply_edit' reply.pk %}{{ sort_qs }}#reply-{{ reply.pk }}">Edit</a>
        <form method="post" action="{% url 'forum:reply_delete' reply.pk %}{{ sort_qs }}"
              data-confirm-title="Delete reply?"
              data-confirm-text="This reply will be removed. This can’t be undone."
              data-confirm-ok="Delete reply">
            {% csrf_token %}
            <button type="submit" class="forum-menu-delete">Delete</button>
        </form>
    </div>
</details>
