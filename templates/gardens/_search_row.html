{% load static %}
{# Search box for the shared list toolbar; pair it with gardens/_sort.html in the results heading #}
<label class="list-search">
    <img src="{% static 'marketplace/img/imgIconSearch.svg' %}" alt="">
    <span class="visually-hidden">{{ search_label }}</span>
    <input type="search" name="q" value="{{ filter_form.q.value|default_if_none:'' }}" maxlength="100" placeholder="{{ placeholder }}">
</label>
