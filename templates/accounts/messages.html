<div class="auth-alerts">
    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}" role="status">{{ message }}</div>
    {% endfor %}
    {% endif %}

    {% for error in form.non_field_errors %}
    <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endfor %}
</div>
