{% load static %}
<footer class="footer">
    <div class="footer-inner">
        <div class="footer-top">
            <a class="footer-logo" href="{% url 'main:show_main' %}">
                <img src="{% static 'img/main-logo-with-text.png' %}" alt="UrFunFarming">
            </a>

            <ul class="footer-links">
                {% if user.profile.is_grower %}
                {% with page=request.resolver_match.view_name %}
                <li><a href="{% url 'gardens:mine' %}"{% if request.resolver_match.app_name == 'gardens' %} aria-current="page"{% endif %}>My gardens</a></li>
                <li><a href="{% url 'journal:index' %}"{% if request.resolver_match.namespace == 'journal' %} aria-current="page"{% endif %}>Plant journal</a></li>
                <li><a href="{% url 'care:index' %}"{% if request.resolver_match.app_name == 'care' %} aria-current="page"{% endif %}>Plant care</a></li>
                {% endwith %}
                {% endif %}
                <li><a href="{% url 'marketplace:index' %}">Market</a></li>
                <li><a href="{% url 'forum:forum_list' %}">Forum</a></li>
                <li><a href="{% url 'gardens:explore' %}">Explore gardens</a></li>
            </ul>
        </div>

        <p class="footer-note">
            &copy; 2026 UrFunFarming. Weather data by BMKG.
        </p>
    </div>
</footer>
