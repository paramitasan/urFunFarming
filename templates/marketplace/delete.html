{% extends 'marketplace/base.html' %}
{% block market_content %}
<a class="market-back" href="{{ listing.get_absolute_url }}">← Back to listing</a>
<section class="market-panel market-delete-panel"><p class="market-eyebrow">MANAGE YOUR HARVEST</p><h1>Delete this listing?</h1><p><strong>{{ listing.title }}</strong> will be removed from the marketplace. This action cannot be undone.</p><form method="post" data-market-write>{% csrf_token %}<div class="market-error" data-form-errors role="alert" tabindex="-1" hidden></div><div class="market-form-actions"><button class="market-button market-button-danger" type="submit">Delete listing</button><a class="market-button market-button-outline" href="{{ listing.get_absolute_url }}">Keep listing</a></div></form></section>
{% endblock %}
