{% load static %}
<header class="header">
    <nav class="navbar" aria-label="Main">
        <a class="logo" href="{% url 'main:show_main' %}">
            <img src="{% static 'img/main-logo-with-text.png' %}" alt="UrFunFarming">
        </a>

        <div class="nav-menu" id="nav-menu">
            <ul class="nav-links">
                <li><a href="{% url 'main:show_main' %}#market" data-label="Market">Market</a></li>
                <li><a href="{% url 'main:show_main' %}#forum" data-label="Forum">Forum</a></li>
                <li><a href="{% url 'main:show_main' %}#gardens" data-label="Gardens">Gardens</a></li>
            </ul>

            {% if not user.is_authenticated %}
            <div class="menu-actions">
                <a class="nav-login" href="{% url 'accounts:login' %}">Log in</a>
                <a class="btn btn-small" href="{% url 'accounts:register' %}">
                    Start growing
                    <span class="well">
                        <svg width="12" height="12" viewBox="11 11 12 12" fill="none" aria-hidden="true">
                            <path d="M12 22L22 12M22 19V12H15" stroke="#0B2E1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                </a>
            </div>
            {% endif %}
        </div>

        <div class="nav-actions">
            {% if user.is_authenticated %}
            <div class="profile-menu">
                <button type="button" class="profile-button" aria-expanded="false" aria-controls="profile-dropdown">
                    <span class="avatar">{% firstof user.profile.initials user.username|slice:":2"|upper %}</span>
                    <span class="profile-name">{% firstof user.profile.display_name user.username %}</span>
                    <img src="{% static 'img/chevron-down.svg' %}" alt="" width="14" height="14">
                </button>
                <div class="profile-dropdown" id="profile-dropdown" hidden>
                    {# TODO: point to the profile page once it exists #}
                    <a href="#">Profile</a>
                    <form method="POST" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit">Log out</button>
                    </form>
                </div>
            </div>
            {% else %}
            <a class="nav-login" href="{% url 'accounts:login' %}">Log in</a>
            <a class="btn btn-small magnetic" href="{% url 'accounts:register' %}">
                Start growing
                <span class="well">
                    <svg width="12" height="12" viewBox="11 11 12 12" fill="none" aria-hidden="true">
                        <path d="M12 22L22 12M22 19V12H15" stroke="#0B2E1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
            {% endif %}
            <button type="button" class="menu-button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>
</header>
